name: Weekly SKAHL Dashboard Refresh

# Runs every Monday at 9am Pacific (16:00 UTC covers PDT/PST within 1hr).
# Also triggerable manually from the Actions tab for testing.
on:
  schedule:
    - cron: '0 16 * * 1'
  workflow_dispatch:

# Allow the workflow to push commits back to the repo
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python setup ────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests --quiet

      # ── 3. Pipeline ────────────────────────────────────────────────────────
      # NOTE: Only the SportNinja API (snokingahl.com) is scraped here.
      # snokinghockeyleague.com is historical/archived data — run
      # skahl_scraper_windows.py manually on your machine if you ever
      # need to backfill older seasons. It is intentionally not called here.

      - name: Step 1 — Fetch active season from SportNinja API
        run: python fetch_active_season.py

      - name: Step 2 — Refresh database with active season data
        run: python skahl_update_active.py

      - name: Step 3 — Build dashboard JSON from database
        run: python build_final.py

      - name: Step 4 — Generate dashboard HTML
        run: python gen_dashboard.py

      # ── 4. Commit & push (only if anything changed) ────────────────────────
      - name: Commit and push updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            active_seasons_data.json \
            skahl_historical.db \
            dashboard_data.json \
            skahl_dashboard.html
          if git diff --staged --quiet; then
            echo "No changes detected — skipping commit."
          else
            git commit -m "🏒 Weekly refresh $(date -u '+%Y-%m-%d')"
            git push
          fi
